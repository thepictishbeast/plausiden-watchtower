[package]
name = "plausiden-watchtower"
version = "0.2.0"
edition = "2021"
license = "BSL-1.1"
repository = "https://github.com/thepictishbeast/plausiden-watchtower"
description = "Tails per-chain structured logs from PlausiDen services, classifies issues, and dispatches alerts. Foundation for #316 (ntfy/email sinks) and #317 (auto-fix loop). v0.2 closes the deployment story: cargo+systemd installer, Nix flake module, manifest-level lint policy, scripts/ci.sh local 5-gate runner. 67 unit tests + 1 doctest, 0 known-vulnerable deps."
readme = "README.md"

[features]
default = []
# Live journald reader (sidecar runs on the VPS). Off by default so the
# parser/classifier libs build on dev machines without libsystemd. The
# tailer pulls in tokio/process + tokio/io-util via the journal binary;
# the email sink also needs tokio/process so those features are hoisted
# to the base dependency block below rather than gated here.
journal = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs"] }
async-trait = "0.1"
# rustls-tls so we never link OpenSSL (one less attack surface), `json`
# is unused (ntfy speaks plain text bodies) and pulled out to keep the
# transitive dep tree narrow per AVP-2.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }

[[bin]]
name = "plausiden-watchtower"
path = "src/main.rs"
required-features = ["journal"]

# Lint policy — declarative, manifest-level. Any caller invoking `cargo
# clippy` (no flags) sees the same gates that CI / deploy/install.sh /
# the flake's `cargo build --release --features journal` enforce.
# This subsumes the `-D warnings` flag callers previously had to
# remember. `priority = -1` on the broad denies lets future tighter
# allow-overrides win at the same lint without flag-precedence surprises.
[lints.rust]
warnings = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
